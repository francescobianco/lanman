<!doctype html>
<html lang="it"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>lanman</title>
<style>
:root{--bg:#fafafa;--fg:#222;--mut:#888;--line:#e5e5e5;--soft:#f0f0f0;--on:#1a9c4b;--off:#c9c9c9;--acc:#2a6df4}
@media (prefers-color-scheme:dark){:root{--bg:#141414;--fg:#e6e6e6;--mut:#8a8a8a;--line:#2a2a2a;--soft:#1d1d1d;--off:#444}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.4 system-ui,sans-serif}
main{max-width:1100px;margin:0 auto;padding:24px 16px}
header{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:16px}
h1{font-size:20px;margin:0}
.mut{color:var(--mut)}
.sp{flex:1}
button,select,input{font:inherit;color:var(--fg);background:none;border:1px solid var(--line);border-radius:6px;padding:4px 10px}
select{background:var(--bg)}
button{cursor:pointer}
button:hover{border-color:var(--acc)}
.wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:7px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-weight:500;color:var(--mut);font-size:12px;text-transform:uppercase;letter-spacing:.04em;cursor:pointer;user-select:none}
tr.dev{cursor:pointer}
tr.dev:hover td{background:var(--soft)}
tr.off td{color:var(--mut)}
tr.grp td{border-bottom:0;padding:22px 6px 6px;font-weight:600;font-size:13px}
tr.grp span{font-weight:400;color:var(--mut);margin-left:6px}
.lk{display:inline-block;width:14px;height:14px;vertical-align:-2px;margin-left:6px;color:var(--mut)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--off)}
tr.on .dot{background:var(--on)}
code{font:12px ui-monospace,monospace}
.tag{font-size:11px;color:var(--mut);border:1px solid var(--line);border-radius:4px;padding:0 4px;margin-left:4px}
.sub{color:var(--mut);margin-left:6px}
.det td{background:var(--soft);white-space:normal;padding:12px 14px 16px}
.kv{display:grid;grid-template-columns:max-content minmax(0,1fr) max-content minmax(0,1fr);gap:4px 16px;margin-bottom:12px}
.kv b{font-weight:500;color:var(--mut)}
.kv span{overflow-wrap:anywhere}
@media (max-width:700px){.kv{grid-template-columns:max-content minmax(0,1fr)}}
.ctl{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
</style></head><body><main>
<header>
  <h1>lanman</h1><span class="mut" id="net"></span><span class="sp"></span>
  <span class="mut" id="cnt"></span>
  <label class="mut"><input type="checkbox" id="onlyOn"> solo online</label>
  <button id="scan">Scansiona</button>
</header>
<div class="wrap"><table>
<thead><tr><th></th><th data-k="label">Nome</th><th data-k="brand">Marca</th><th data-k="model">Modello</th>
<th data-k="ip">IP</th><th data-k="mac">MAC</th><th data-k="last_seen">Visto</th></tr></thead>
<tbody id="tb"></tbody></table></div>
<p class="mut" id="foot"></p>
</main>
<script>
let data={devices:[],types:[]},sortK='ip',sortD=1,open=null;
const $=s=>document.querySelector(s);
const ipn=ip=>ip.split('.').reduce((a,b)=>a*256+ +b,0);
const ago=t=>{if(!t)return'';const s=Date.now()/1000-t;
  if(s<90)return'ora';if(s<3600)return Math.round(s/60)+' min fa';
  if(s<86400)return Math.round(s/3600)+' h fa';return Math.round(s/86400)+' g fa'};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const label=d=>d.display_name||'';
try{$('#onlyOn').checked=localStorage.lanmanOnly==='1'}catch(e){}

const ICONS={
  wifi:'<path d="M2 6.5a9 9 0 0 1 12 0M4.2 8.8a6 6 0 0 1 7.6 0M6.4 11.1a3 3 0 0 1 3.2 0"/><circle cx="8" cy="13" r=".9" fill="currentColor"/>',
  wired:'<rect x="3" y="4" width="10" height="8" rx="1"/><path d="M5.5 12V9.5h5V12M6.5 7h.01M8 7h.01M9.5 7h.01"/>',
  vpn:'<rect x="3.5" y="7" width="9" height="6.5" rx="1"/><path d="M5.5 7V5a2.5 2.5 0 0 1 5 0v2"/>'};
const LINKS={wifi:'Wi-Fi',wired:'Cavo (Ethernet)',vpn:'VPN'};
const linkIcon=d=>d.link?`<svg class="lk" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><title>${LINKS[d.link]} — ${esc(d.link_source)}</title>${ICONS[d.link]}</svg>`:'<span class="lk"></span>';
const proto=p=>p==443||p==8443||p==5001?'https':'http';
const fmt=t=>t?new Date(t*1000).toLocaleString():'';
// one list of [label, text, html?] feeds both the detail view and the copied card
function card(d){
  const x=d.details||{},l=d.local||{},rows=[];
  const add=(k,v,h)=>{if(v)rows.push([k,v,h])};
  add('Tipo',(Object.fromEntries(data.types)[d.type]||d.type)+(d.type_guess?' (dedotto)':''));
  add('Marca',d.brand);add('Modello',d.model);add('Sistema operativo',d.os);
  add('CPU',l.cpu);add('RAM',l.ram);add('Kernel',l.kernel);
  add('Stato',d.online?'online':'offline, visto '+fmt(d.last_seen));
  add('Connessione',d.link&&`${LINKS[d.link]} (${d.link_source})`);
  add('Indirizzi IP',(d.ips||[d.ip]).join(', '));
  add('MAC',d.mac);
  add('Produttore (MAC)',d.vendor||(d.mac&&/^.[26ae]/.test(d.mac)?'MAC privato/randomizzato':''));
  add('Hostname DNS',d.hostname);
  add('Hostname mDNS',x.mdns_hostname);
  add('Nome nel router',d.router_name);
  add('NetBIOS',x.netbios&&[x.netbios.name,x.netbios.group].filter(Boolean).join(' / '));
  add('Servizi mDNS',(x.mdns_services||[]).join('  '));
  add('UPnP',x.upnp&&[x.upnp.friendlyName,x.upnp.manufacturer,x.upnp.modelName,x.upnp.modelNumber,
      (x.upnp.device_types||[]).join(', ')].filter(Boolean).join(' · '));
  add('Server SSDP',x.ssdp_server);
  add('Stampante condivisa',d.shared_printer);
  add('Porte aperte',(x.ports||[]).join(', '));
  add('SSH',x.ssh);
  const web=x.http||[];
  add('Web',web.map(h=>`${proto(h.port)}://${d.ip}:${h.port}/ ${[h.title,h.server].filter(Boolean).join(' — ')}`).join('\n'),
      web.map(h=>`<a href="${proto(h.port)}://${esc(d.ip)}:${h.port}/" target="_blank">:${h.port}</a> ${esc([h.title,h.server].filter(Boolean).join(' — '))}`).join('<br>'));
  add('Note',d.note);
  add('Visto la prima volta',fmt(d.first_seen));
  add('Identificato',d.probed_at?fmt(d.probed_at):'non ancora');
  return rows;
}
function cardText(d){
  return [label(d),''.padEnd(label(d).length,'=')].concat(
    card(d).map(([k,v])=>k+': '+String(v).replace(/\n/g,'\n'+' '.repeat(k.length+2)))).join('\n');
}
function detail(d){
  const rows=card(d).slice(4).map(([k,v,h])=>`<b>${esc(k)}</b><span>${h||esc(v)}</span>`);
  return `<tr class="det"><td colspan="7"><div class="kv">${rows.join('')}</div>
    <div class="ctl"><button data-copy="${esc(d.id)}">Copia scheda</button></div></td></tr>`;
}
async function copy(text){
  try{await navigator.clipboard.writeText(text);return true}catch(e){}
  const t=document.createElement('textarea');t.value=text;t.style.position='fixed';t.style.opacity='0';
  document.body.appendChild(t);t.select();let ok=false;try{ok=document.execCommand('copy')}catch(e){}
  t.remove();return ok;
}

function render(){
  let ds=data.devices.slice();
  if($('#onlyOn').checked)ds=ds.filter(d=>d.online);
  const order=Object.fromEntries(data.types.map(([k],i)=>[k,i]));
  ds.sort((a,b)=>{
    if(a.type!==b.type)return order[a.type]-order[b.type];
    if(a.online!==b.online)return a.online?-1:1;
    let x,y;
    if(sortK==='ip'){x=ipn(a.ip);y=ipn(b.ip)}
    else if(sortK==='label'){x=label(a).toLowerCase();y=label(b).toLowerCase()}
    else{x=a[sortK]||'';y=b[sortK]||''}
    return (x<y?-1:x>y?1:0)*sortD});
  const names=Object.fromEntries(data.types),out=[];let cur=null;
  for(const d of ds){
    if(d.type!==cur){cur=d.type;const n=ds.filter(x=>x.type===cur);
      out.push(`<tr class="grp"><td colspan="7">${esc(names[cur]||cur)}<span>${n.filter(x=>x.online).length}/${n.length}</span></td></tr>`)}
    const tags=(d.is_self?'<span class="tag">questo host</span>':'')+(d.is_gateway?'<span class="tag">gateway</span>':'')
      +(d.type_guess&&d.type!=='unknown'?'<span class="tag" title="tipologia dedotta con pochi indizi">?</span>':'');
    const extra=(d.ips||[]).length>1?` <span class="mut">+${d.ips.length-1}</span>`:'';
    const rnd=d.mac&&/^.[26ae]/.test(d.mac)?'<span class="tag" title="MAC privato/randomizzato">rnd</span>':'';
    out.push(`<tr class="dev ${d.online?'on':'off'}" data-id="${esc(d.id)}">
      <td><span class="dot" title="${d.online?(d.ping?'online':'online (no ping)'):'offline'}"></span>${linkIcon(d)}</td>
      <td>${esc(label(d))}${tags}</td>
      <td>${esc(d.brand)}</td><td>${esc(d.model)}${d.os?`<span class="${d.model?'sub':'mut'}">${esc(d.os)}</span>`:''}</td>
      <td><code>${esc(d.ip)}</code>${extra}</td>
      <td><code>${esc(d.mac)}</code>${rnd}</td>
      <td>${d.online?'online':ago(d.last_seen)}</td></tr>`);
    if(open===d.id)out.push(detail(d));
  }
  $('#tb').innerHTML=out.join('');
  const on=data.devices.filter(d=>d.online).length;
  $('#cnt').textContent=`${on} online / ${data.devices.length}`;
  $('#net').textContent=`${data.network||''} su ${data.iface||''}`;
  $('#foot').textContent=data.scanning?'scansione in corso…':data.probing?'identificazione dispositivi in corso…':
    (data.last_scan?'ultima scansione: '+new Date(data.last_scan*1000).toLocaleTimeString():'');
}
async function load(){try{data=await (await fetch('/api/devices')).json();render()}catch(e){$('#foot').textContent='server non raggiungibile'}}
async function post(u,b){await fetch(u,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b||{})})}

$('#scan').onclick=async()=>{await post('/api/scan');setTimeout(load,500)};
$('#onlyOn').onchange=()=>{try{localStorage.lanmanOnly=$('#onlyOn').checked?'1':'0'}catch(e){}render()};
document.querySelectorAll('th[data-k]').forEach(th=>th.onclick=()=>{
  sortD=sortK===th.dataset.k?-sortD:1;sortK=th.dataset.k;render()});
$('#tb').onclick=async e=>{
  const c=e.target.closest('button[data-copy]');
  if(c){const d=data.devices.find(x=>x.id===c.dataset.copy);
    c.textContent=await copy(cardText(d))?'Copiata ✓':'Copia non riuscita';
    setTimeout(()=>c.textContent='Copia scheda',1500);return}
  const tr=e.target.closest('tr.dev');
  if(tr){open=open===tr.dataset.id?null:tr.dataset.id;render()}
};
load();setInterval(()=>{const a=document.activeElement;if(!a||!a.closest||!a.closest('.ctl'))load()},5000);
</script></body></html>
